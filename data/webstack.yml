# 站点元数据
title: 音速 NEXT
subtitle: Windows 装机导航
favicon: /favicon.svg

# 侧边栏菜单结构
# 每个菜单项通过 config 字段引用 data/ 目录下的同名 YAML 文件（不含 .yml 后缀）
# 顶层菜单项可直接配置 config，也可通过 submenu 定义二级分组
menu:
  - name: 通讯上网
    icon: fab fa-internet-explorer
    submenu:
      - name: 聊天
        icon: fas fa-message
        config: chat
      - name: 浏览器
        icon: fab fa-chrome
        config: browser
        description: 一般来说，除系统自带的浏览器外，以下浏览器只安装一款即可。
      - name: 下载
        icon: fas fa-download
        config: download
        description: 浏览器的下载功能已经可以满足大部分用户的下载需求。对于有需要的用户，这里也列出了几款专用的下载客户端。
      - name: 邮箱
        icon: fas fa-envelope
        config: mail
  - name: 影音图像
    icon: fas fa-photo-film
    submenu:
      - name: 视频
        icon: fas fa-video
        config: video
      - name: 音乐
        icon: fas fa-music
        config: music
      - name: 图片
        icon: fas fa-image
        config: image
        description: Windows 系统默认的图片查看器已经可以满足绝大部分用户的需求，一般无需安装第三方看图软件。
      - name: 创作
        icon: fas fa-film
        config: mediacreation
  - name: 工作效率
    icon: fas fa-laptop-file
    submenu:
      - name: 办公
        icon: fas fa-briefcase
        config: office
      - name: AI
        icon: fas fa-brain
        config: ai
      - name: 压缩
        icon: fas fa-file-zipper
        config: zipper
        description: 虽然最新版 Windows 已经内置了对多种压缩格式的支持，但不算好用。可以下载下面的第三方压缩软件，只安装一款即可。
      - name: 网盘
        icon: fas fa-cloud
        config: cloud
      - name: 输入法
        icon: fas fa-keyboard
        config: input
        description: Windows 系统自带的输入法已经可以满足大部分用户的需求。对于有云同步、语音输入等高级功能需求的用户，这里也列出了几款国产输入法。以下输入法只安装一款即可。
      - name: 效率
        icon: fas fa-tools
        config: efficiency
      - name: 远程
        icon: fas fa-window-restore
        config: remote
      - name: 互联
        icon: fas fa-mobile-alt
        config: mobile
  - name: 安全维护
    icon: fas fa-shield-alt
    submenu:
      - name: 防病毒
        icon: fas fa-virus-slash
        config: antivirus
        description: 虽然 Windows 系统自带安全中心，理论上无需安装第三方防病毒软件，但是对于初上手的电脑用户，最好还是安装一款靠谱的第三方安全软件，并作一些妥当的配置。请不要同时安装多款第三方安全软件！
      - name: 维护
        icon: fas fa-wrench
        config: maintenance
        description: 仅在电脑出现故障或有需要时下载使用。操作前请备份重要数据！
      - name: 验机
        icon: fas fa-circle-check
        config: yanji
        description: 新电脑和二手电脑验机常用的软件。
      - name: 驱动
        icon: fas fa-gears
        config: driver
        description: 品牌台式机或新购笔记本电脑的用户可跳过此节，因为厂商已经在电脑中预装了驱动。对于组装电脑或重装系统的用户，Windows 10/11 系统会自动补齐一部分驱动，但版本可能较旧。建议将显卡驱动更新至最新版本；其他硬件驱动受篇幅所限，此处无法逐一列出各厂商的官网，请根据实际硬件型号前往对应厂商官网获取。
  - name: 游戏相关
    icon: fas fa-gamepad
    submenu:
      - name: 平台
        icon: fab fa-itch-io
        config: gameplatform
        description: 像 Steam、Epic、EA 这样的游戏平台提供的游戏绝大部分都需要付费购买，使用这些境外游戏平台可能需要加速器（见下），仅加速游戏平台时一般是免费的。
      - name: 工具
        icon: fas fa-puzzle-piece
        config: gametool
  - name: 站长推荐
    nameAlt: 推荐
    icon: fas fa-thumbs-up
    config: recommend
  - name: 致敬
    icon: fas fa-trophy
    config: salute 

about:
  url: /about/
  icon: far fa-heart
  name: 关于本站

# 关于页面配置
# website.md 指向 data/ 目录下的 Markdown 文件，渲染为「关于本站」区块
# webmaster 为「本站站长」区块，不需要时整段删除即可
aboutPage:
  website:
    head: 关于本站
    md: about.md

since: 2026

# 批量安装预设
# 预设在此处声明，列表顺序即界面显示顺序，第一个预设为批量模式默认预设。
# 各软件是否属于某个预设，在分类 YAML 的条目上标注即可（可写单个字符串或数组）：
#   winget_presets: [basic, dev]
# 未在此声明的预设 id 会按条目上的标注自动补齐（显示名即 id）。
wingetPresets:
  - id: basic
    name: 基础推荐
    description: 新电脑必备软件
  - id: china
    name: 国产优先
    description: 优先勾选国产软件
  - id: clean
    name: 纯净装机
    description: 开源优先，不包含任何 pup 软件
  - id: office
    name: 办公必备
    description: 预选一些日常办公所需的软件
  - id: gaming
    name: 玩家必备
    description: 游戏玩家必装软件
  - id: creative
    name: 媒体创作
    description: 媒体创作者的必备软件
  - id: entertainment
    name: 影音娱乐
    description: 影音娱乐必装软件